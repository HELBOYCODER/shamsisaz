name: Build ShamsiSaz APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'dist/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (تاریخ‌ها، مناسبت‌ها، Robolectric)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "ShamsiSaz-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=ShamsiSaz-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShamsiSaz-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html

      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-b${{ github.run_number }}
          name: "شمسی‌ساز v${{ steps.apk.outputs.version }}"
          files: ${{ steps.apk.outputs.file }}
          body: |
            ## شمسی‌ساز ${{ steps.apk.outputs.version }} ☀️

            تقویم شمسی کامل با تعطیلات رسمی، ویجت ماهانه، تاریخ در نوار وضعیت، افزودن مناسبت‌های ایران به تقویم گوشی،
            تبدیل تاریخ‌های میلادیِ داخل رویدادها (با بازگردانی) و فارسی‌سازی سیستم با شیزوکو.

            ### نصب
            فایل APK را دانلود و نصب کنید (اندروید ۷ به بالا). همهٔ نسخه‌ها با یک کلید امضا می‌شوند و روی هم آپدیت می‌شوند.
