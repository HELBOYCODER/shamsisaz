name: Build ShamsiSaz APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShamsiSaz-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "شمسی‌ساز v1.0.${{ github.run_number }}"
          body: |
            ## شمسی‌ساز — یک‌دکمه تبدیل تقویم به شمسی ☀️

            - ✨ یک دکمه: همهٔ رویدادهای تقویم میلادی → شمسی
            - ⚙️ میانبر تنظیمات سیستم: کل گوشی را از تنظیمات شمسی کن
            - 📱 پشتیبانی کامل سامسونگ (One UI) و شیائومی (MIUI)
            - 🔍 پیش‌نمایش قبل از تبدیل + ↩️ بازگردانی کامل
            - 📶 آفلاین — بدون نیاز به اینترنت

            ### نصب
            1. فایل `ShamsiSaz-v1.0.apk` را دانلود کن
            2. روی گوشی نصب کن
            3. اپ را باز کن — دسترسی تقویم را بده — دکمهٔ جادویی را بزن!

            > اندروید ۷ به بالا — همهٔ برندها
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
